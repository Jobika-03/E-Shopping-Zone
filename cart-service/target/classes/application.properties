server.port=8083
spring.application.name=cart-service

spring.datasource.url=jdbc:mysql://localhost:3306/eshopping_cart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Jobika@2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.cloud.loadbalancer.cache.enabled=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Suppress repetitive connection retry stacktraces when Eureka server is starting or offline
logging.level.com.netflix.discovery=ERROR
logging.level.com.netflix.discovery.shared.transport.decorator.RetryableEurekaHttpClient=ERROR
logging.level.org.springframework.cloud.netflix.eureka=ERROR
